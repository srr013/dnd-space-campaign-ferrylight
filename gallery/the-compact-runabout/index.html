<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Compact runabout</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=News+Cycle:wght@400;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap"><style>
:root{--bg:#eef2f4;--surface:#f9fbfc;--ink:#13212b;--muted:#52646f;--line:#c3d0d7;--accent:#0b7a85}
@media (prefers-color-scheme:dark){:root{--bg:#0b1520;--surface:#101e2b;--ink:#e2ebf0;--muted:#8a9eab;--line:#233646;--accent:#4fc4cf}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
.flyer{max-width:1000px;margin:0 auto;background:var(--surface);border:1px solid var(--ink)}
.mast{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;align-items:baseline;padding:14px 20px;border-bottom:3px double var(--ink)}
.brand{font:700 2.2rem/1 "News Cycle","Arial Narrow",Arial,sans-serif;letter-spacing:.04em;text-transform:uppercase}
.meta{font:12px "IBM Plex Mono",ui-monospace,Menlo,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.body{padding:18px 20px;display:flex;flex-direction:column;gap:22px}
h3{font:600 12px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
figure{margin:0;border:1px solid var(--line);background:var(--bg)}
figure img{display:block;width:100%;height:auto}
figcaption{padding:8px 10px;font-size:14px}figcaption b{display:block;font-weight:600}
.toolbar{max-width:1000px;margin:0 auto 12px}.toolbar a{color:var(--accent);font-size:14px}
@media print{body{padding:0;background:#fff;color:#000}.toolbar{display:none}figure{break-inside:avoid}}

body.view{background:#05070d;color:#f3efe6;padding:16px}
.view .toolbar a{color:#2bbdee}
.plate{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:12px;align-items:center}
.plate img{display:block;max-width:100%;max-height:82vh;width:auto;height:auto;border:1px solid #3a3020}
.plate h1{font:700 clamp(1.6rem,5vw,2.6rem)/1.1 "News Cycle","Arial Narrow",Arial,sans-serif;letter-spacing:.05em;text-transform:uppercase;margin:6px 0 0;text-align:center}
.plate p{margin:0;color:#2bbdee;font:700 1.05rem "News Cycle","Arial Narrow",Arial,sans-serif;text-align:center}
.nav{display:flex;gap:18px;justify-content:center;font:14px "IBM Plex Sans",system-ui,sans-serif}.nav a{color:#2bbdee}
</style></head><body class="view"><div class="plate"><img src="the-compact-runabout.svg" alt="The Compact runabout"><h1>The Compact runabout</h1><p>The loaner. Functional, unglamorous, much repaired</p><div class="nav"><a href="../the-unmarked-transport/">Previous</a><a href="../">All plates</a></div></div></body></html>
